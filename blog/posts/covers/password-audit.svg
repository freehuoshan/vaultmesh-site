<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#0e1d3a"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111f40"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#3b82f6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="54" fill="white">How to find and</text>
  <text x="76" y="254" font-family="Georgia, serif" font-size="54" fill="white">fix your weakest</text>
  <text x="76" y="320" font-family="Georgia, serif" font-size="54" fill="white">passwords</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-17  ·  passwords  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Password audit report panel ── -->

  <!-- Main panel -->
  <rect x="718" y="72" width="432" height="498" rx="12" fill="url(#panelGrad)" stroke="#1e3560" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="718" y="72" width="432" height="40" rx="12" fill="#0f1e3a"/>
  <rect x="718" y="98" width="432" height="14" fill="#0f1e3a"/>
  <text x="730" y="98" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">AUDIT REPORT</text>
  <text x="1138" y="97" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.25)" text-anchor="end">4 accounts checked</text>

  <!-- Severity summary bar -->
  <line x1="730" y1="118" x2="1138" y2="118" stroke="#1e3560" stroke-width="1"/>
  <rect x="730" y="126" width="104" height="16" rx="3" fill="rgba(239,68,68,0.18)" stroke="rgba(239,68,68,0.35)" stroke-width="1"/>
  <text x="782" y="138" font-family="monospace" font-size="7" fill="rgba(239,68,68,0.78)" text-anchor="middle" letter-spacing="1">1 BREACH</text>
  <rect x="840" y="126" width="112" height="16" rx="3" fill="rgba(251,191,36,0.14)" stroke="rgba(251,191,36,0.35)" stroke-width="1"/>
  <text x="896" y="138" font-family="monospace" font-size="7" fill="rgba(251,191,36,0.72)" text-anchor="middle" letter-spacing="1">2 WARNINGS</text>
  <rect x="958" y="126" width="88" height="16" rx="3" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.28)" stroke-width="1"/>
  <text x="1002" y="138" font-family="monospace" font-size="7" fill="rgba(34,197,94,0.65)" text-anchor="middle" letter-spacing="1">1 OK</text>

  <!-- ─── ROW 1: Email — OK (green) ─── -->
  <line x1="730" y1="152" x2="1138" y2="152" stroke="#1e3560" stroke-width="1"/>
  <rect x="730" y="152" width="3" height="84" fill="rgba(34,197,94,0.6)"/>
  <text x="742" y="170" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.65)">Email account</text>
  <text x="742" y="184" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.3)">Unique password · not found in any breach</text>
  <text x="742" y="198" font-family="monospace" font-size="7" fill="rgba(34,197,94,0.5)">2FA enabled · last changed 4 months ago</text>
  <rect x="1060" y="162" width="68" height="18" rx="4" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
  <text x="1094" y="175" font-family="monospace" font-size="8" fill="rgba(34,197,94,0.75)" text-anchor="middle" letter-spacing="1">OK</text>

  <!-- ─── ROW 2: Banking — REUSED (amber) ─── -->
  <line x1="730" y1="236" x2="1138" y2="236" stroke="#1e3560" stroke-width="1"/>
  <rect x="730" y="236" width="3" height="84" fill="rgba(251,191,36,0.6)"/>
  <text x="742" y="254" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.6)">Banking account</text>
  <text x="742" y="268" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.55)">Password reused across 3 other sites</text>
  <text x="742" y="282" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)">Last changed: over 2 years ago</text>
  <rect x="1044" y="246" width="84" height="18" rx="4" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.38)" stroke-width="1"/>
  <text x="1086" y="259" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.72)" text-anchor="middle" letter-spacing="1">REUSED</text>

  <!-- ─── ROW 3: Shopping — BREACH (red) ─── -->
  <line x1="730" y1="320" x2="1138" y2="320" stroke="#1e3560" stroke-width="1"/>
  <rect x="730" y="320" width="3" height="84" fill="rgba(239,68,68,0.7)"/>
  <text x="742" y="338" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.55)">Shopping account</text>
  <text x="742" y="352" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.6)">Password found in breach database</text>
  <text x="742" y="366" font-family="monospace" font-size="7" fill="rgba(239,68,68,0.5)">Change immediately · reused elsewhere</text>
  <rect x="1044" y="330" width="84" height="18" rx="4" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.42)" stroke-width="1"/>
  <text x="1086" y="343" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.82)" text-anchor="middle" letter-spacing="1">BREACH</text>

  <!-- ─── ROW 4: Work — WEAK (amber) ─── -->
  <line x1="730" y1="404" x2="1138" y2="404" stroke="#1e3560" stroke-width="1"/>
  <rect x="730" y="404" width="3" height="76" fill="rgba(251,191,36,0.45)"/>
  <text x="742" y="422" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.5)">Work / admin account</text>
  <text x="742" y="436" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.45)">Short password, predictable pattern</text>
  <text x="742" y="450" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.22)">No 2FA enabled</text>
  <rect x="1052" y="414" width="76" height="18" rx="4" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
  <text x="1090" y="427" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.65)" text-anchor="middle" letter-spacing="1">WEAK</text>

  <!-- Panel footer -->
  <line x1="718" y1="480" x2="1150" y2="480" stroke="#1e3560" stroke-width="1"/>
  <text x="730" y="502" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.2)">Fix first: email → banking → anything with saved payment info</text>
  <text x="730" y="518" font-family="monospace" font-size="8" fill="rgba(59,130,246,0.45)">haveibeenpwned.com → check your email address</text>
  <text x="730" y="534" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.15)">Change reused passwords one site at a time before moving on</text>
  <text x="730" y="550" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.15)">Enable 2FA on email and banking after each password change</text>
</svg>
