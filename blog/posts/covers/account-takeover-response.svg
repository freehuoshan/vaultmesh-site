<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#0e1d3a"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111f40"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#3b82f6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="54" fill="white">What to do when</text>
  <text x="76" y="254" font-family="Georgia, serif" font-size="54" fill="white">you think your</text>
  <text x="76" y="320" font-family="Georgia, serif" font-size="54" fill="white">account has</text>
  <text x="76" y="386" font-family="Georgia, serif" font-size="54" fill="white">been hacked</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-21  ·  accounts  ·  breaches  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Response checklist ── -->

  <!-- Main panel -->
  <rect x="718" y="72" width="432" height="498" rx="12" fill="url(#panelGrad)" stroke="#1e3560" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="718" y="72" width="432" height="40" rx="12" fill="#0f1e3a"/>
  <rect x="718" y="98" width="432" height="14" fill="#0f1e3a"/>
  <text x="730" y="98" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">ACCOUNT RESPONSE</text>
  <text x="1138" y="97" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.25)" text-anchor="end">do these in order</text>

  <!-- ─── STEP 1: Change password (red — urgent) ─── -->
  <line x1="730" y1="118" x2="1138" y2="118" stroke="#1e3560" stroke-width="1"/>
  <rect x="730" y="118" width="3" height="82" fill="rgba(239,68,68,0.75)"/>
  <!-- Step number -->
  <text x="742" y="136" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.5)" letter-spacing="1">STEP 1</text>
  <text x="742" y="150" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.75)">Change the password</text>
  <text x="742" y="164" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.35)">New unique password — not used anywhere else</text>
  <text x="742" y="178" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.28)">If locked out, go to account recovery first</text>
  <!-- Badge -->
  <rect x="1052" y="124" width="76" height="18" rx="4" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.5)" stroke-width="1"/>
  <text x="1090" y="137" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.85)" text-anchor="middle" letter-spacing="1">DO FIRST</text>

  <!-- ─── STEP 2: Log out sessions (amber) ─── -->
  <line x1="730" y1="200" x2="1138" y2="200" stroke="#1e3560" stroke-width="1"/>
  <rect x="730" y="200" width="3" height="82" fill="rgba(251,191,36,0.65)"/>
  <text x="742" y="218" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.45)" letter-spacing="1">STEP 2</text>
  <text x="742" y="232" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.7)">Log out all other sessions</text>
  <text x="742" y="246" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.35)">Settings → Security → Active sessions / devices</text>
  <text x="742" y="260" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.28)">Revokes access tokens — kick out all other logins</text>
  <!-- Badge -->
  <rect x="1064" y="206" width="64" height="18" rx="4" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.4)" stroke-width="1"/>
  <text x="1096" y="219" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.72)" text-anchor="middle" letter-spacing="1">NEXT</text>

  <!-- ─── STEP 3: Audit settings (amber) ─── -->
  <line x1="730" y1="282" x2="1138" y2="282" stroke="#1e3560" stroke-width="1"/>
  <rect x="730" y="282" width="3" height="110" fill="rgba(251,191,36,0.5)"/>
  <text x="742" y="300" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.4)" letter-spacing="1">STEP 3</text>
  <text x="742" y="314" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.65)">Audit what the attacker may have changed</text>
  <text x="742" y="330" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.35)">Recovery email &amp; phone → verify each one is yours</text>
  <text x="742" y="346" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.35)">Email forwarding rules → delete anything unfamiliar</text>
  <text x="742" y="362" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.28)">Third-party app access → revoke unknown connections</text>
  <!-- Badge -->
  <rect x="1064" y="290" width="64" height="18" rx="4" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.35)" stroke-width="1"/>
  <text x="1096" y="303" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.65)" text-anchor="middle" letter-spacing="1">THEN</text>

  <!-- ─── STEP 4: Enable 2FA (green) ─── -->
  <line x1="730" y1="392" x2="1138" y2="392" stroke="#1e3560" stroke-width="1"/>
  <rect x="730" y="392" width="3" height="86" fill="rgba(34,197,94,0.6)"/>
  <text x="742" y="410" font-family="monospace" font-size="8" fill="rgba(34,197,94,0.45)" letter-spacing="1">STEP 4</text>
  <text x="742" y="424" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.65)">Enable two-factor authentication</text>
  <text x="742" y="438" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.35)">Stops repeat access even if password leaks again</text>
  <text x="742" y="452" font-family="monospace" font-size="7.5" fill="rgba(34,197,94,0.45)">Authenticator app &gt; SMS codes &gt; nothing</text>
  <!-- Badge -->
  <rect x="1036" y="400" width="92" height="18" rx="4" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
  <text x="1082" y="413" font-family="monospace" font-size="7" fill="rgba(34,197,94,0.72)" text-anchor="middle" letter-spacing="1">BEFORE CLOSING</text>

  <!-- Panel footer -->
  <line x1="718" y1="478" x2="1150" y2="478" stroke="#1e3560" stroke-width="1"/>
  <text x="730" y="500" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.2)">After: change password on any account sharing the same credential</text>
  <text x="730" y="516" font-family="monospace" font-size="8" fill="rgba(59,130,246,0.4)">Email accounts: check forwarding rules first — easy to miss</text>
  <text x="730" y="532" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.15)">Work account compromised? Notify IT/security team even after self-recovery</text>
  <text x="730" y="548" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.15)">Review activity log to understand what was accessed during the breach window</text>
</svg>
