<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#0e1d3a"/>
    </linearGradient>
    <linearGradient id="vaultBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162040"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="dialGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#3b82f6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="56" fill="white">What a password</text>
  <text x="76" y="256" font-family="Georgia, serif" font-size="56" fill="white">manager actually</text>
  <text x="76" y="324" font-family="Georgia, serif" font-size="56" fill="white">does</text>
  <text x="76" y="392" font-family="Georgia, serif" font-size="44" fill="rgba(255,255,255,0.7)">(and doesn't do)</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-06-28  ·  passwords  ·  password-managers  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Vault illustration ── -->

  <!-- Vault body -->
  <rect x="740" y="80" width="360" height="460" rx="20" fill="url(#vaultBody)" stroke="#1e3560" stroke-width="2"/>

  <!-- Vault door inset -->
  <rect x="760" y="100" width="320" height="420" rx="14" fill="none" stroke="#1a2f58" stroke-width="1.5"/>

  <!-- Hinge bars (left side of vault door) -->
  <rect x="760" y="145" width="14" height="36" rx="4" fill="#1a3060" stroke="#243d72" stroke-width="1"/>
  <rect x="760" y="419" width="14" height="36" rx="4" fill="#1a3060" stroke="#243d72" stroke-width="1"/>

  <!-- Combination dial background glow -->
  <circle cx="920" cy="305" r="115" fill="rgba(30,64,175,0.08)"/>

  <!-- Combination dial outer ring -->
  <circle cx="920" cy="305" r="105" fill="none" stroke="#1e3a6e" stroke-width="3"/>

  <!-- Tick marks around the dial -->
  <g stroke="#2a4f8a" stroke-width="1.5" stroke-linecap="round">
    <!-- 12 major ticks -->
    <line x1="920" y1="200" x2="920" y2="215"/>
    <line x1="972" y1="215" x2="964" y2="228"/>
    <line x1="1010" y1="253" x2="999" y2="261"/>
    <line x1="1025" y1="305" x2="1010" y2="305"/>
    <line x1="1010" y1="357" x2="999" y2="349"/>
    <line x1="972" y1="395" x2="964" y2="382"/>
    <line x1="920" y1="410" x2="920" y2="395"/>
    <line x1="868" y1="395" x2="876" y2="382"/>
    <line x1="830" y1="357" x2="841" y2="349"/>
    <line x1="815" y1="305" x2="830" y2="305"/>
    <line x1="830" y1="253" x2="841" y2="261"/>
    <line x1="868" y1="215" x2="876" y2="228"/>
  </g>

  <!-- Dial face -->
  <circle cx="920" cy="305" r="88" fill="#0d1a33" stroke="#243d72" stroke-width="2"/>

  <!-- Inner ring detail -->
  <circle cx="920" cy="305" r="70" fill="none" stroke="#1a2f55" stroke-width="1"/>

  <!-- Dial indicator line (pointing to ~2 o'clock position) -->
  <line x1="920" y1="305" x2="965" y2="228" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Dial center hub -->
  <circle cx="920" cy="305" r="14" fill="#1a3060" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="920" cy="305" r="5" fill="#3b82f6"/>

  <!-- Vault handle (right side) -->
  <rect x="1045" y="288" width="38" height="34" rx="10" fill="#111f40" stroke="#243d72" stroke-width="1.5"/>
  <circle cx="1064" cy="305" r="8" fill="none" stroke="#2a4f8a" stroke-width="1.5"/>

  <!-- Keyhole -->
  <ellipse cx="920" cy="388" rx="7" ry="9" fill="#3b82f6" opacity="0.5"/>
  <rect x="917" y="393" width="6" height="12" rx="2" fill="#3b82f6" opacity="0.5"/>

  <!-- ── Credential entries floating to the left of the vault ── -->
  <!-- Entry card 1 -->
  <rect x="690" y="120" width="130" height="36" rx="6" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <rect x="702" y="131" width="36" height="5" rx="2.5" fill="rgba(59,130,246,0.55)"/>
  <rect x="702" y="141" width="60" height="4" rx="2" fill="rgba(255,255,255,0.12)"/>
  <!-- Arrow into vault -->
  <line x1="757" y1="138" x2="742" y2="138" stroke="rgba(59,130,246,0.35)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Entry card 2 -->
  <rect x="676" y="172" width="130" height="36" rx="6" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
  <rect x="688" y="183" width="28" height="5" rx="2.5" fill="rgba(59,130,246,0.45)"/>
  <rect x="688" y="193" width="52" height="4" rx="2" fill="rgba(255,255,255,0.10)"/>
  <line x1="757" y1="190" x2="742" y2="190" stroke="rgba(59,130,246,0.28)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Entry card 3 -->
  <rect x="684" y="224" width="130" height="36" rx="6" fill="rgba(59,130,246,0.06)" stroke="rgba(59,130,246,0.16)" stroke-width="1"/>
  <rect x="696" y="235" width="44" height="5" rx="2.5" fill="rgba(59,130,246,0.35)"/>
  <rect x="696" y="245" width="68" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <line x1="757" y1="242" x2="742" y2="242" stroke="rgba(59,130,246,0.22)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Key icon at bottom right -->
  <g transform="translate(835, 468)" opacity="0.5">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="18" y="-4" width="48" height="8" rx="3" fill="#3b82f6"/>
    <rect x="48" y="4" width="7" height="12" rx="2" fill="#3b82f6"/>
    <rect x="58" y="4" width="7" height="9" rx="2" fill="#3b82f6"/>
  </g>
  <text x="895" y="500" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.25)" letter-spacing="3">MASTER KEY</text>
</svg>
