<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#0e1d3a"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111f40"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#3b82f6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="56" fill="white">The apps still</text>
  <text x="76" y="254" font-family="Georgia, serif" font-size="56" fill="white">connected to</text>
  <text x="76" y="320" font-family="Georgia, serif" font-size="56" fill="white">your accounts</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-15  ·  accounts  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Connected apps panel ── -->

  <!-- Main panel -->
  <rect x="718" y="72" width="432" height="498" rx="12" fill="url(#panelGrad)" stroke="#1e3560" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="718" y="72" width="432" height="40" rx="12" fill="#0f1e3a"/>
  <rect x="718" y="98" width="432" height="14" fill="#0f1e3a"/>
  <text x="730" y="98" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">CONNECTED APPS</text>
  <text x="1088" y="97" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.25)" text-anchor="end">Security settings</text>

  <!-- ─── ROW 1: Active app (green) ─── -->
  <line x1="730" y1="122" x2="1138" y2="122" stroke="#1e3560" stroke-width="1"/>
  <!-- App name + permission -->
  <text x="730" y="140" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.65)">WorkspaceSync</text>
  <text x="730" y="154" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)">Read/write: Google Drive · Calendar</text>
  <text x="730" y="168" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.2)">Last used: 2 days ago</text>
  <!-- Status badge -->
  <rect x="1056" y="130" width="72" height="18" rx="4" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
  <text x="1092" y="143" font-family="monospace" font-size="8" fill="rgba(34,197,94,0.75)" text-anchor="middle" letter-spacing="1">ACTIVE</text>

  <!-- ─── ROW 2: Stale app (amber) ─── -->
  <line x1="730" y1="184" x2="1138" y2="184" stroke="#1e3560" stroke-width="1"/>
  <text x="730" y="202" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.55)">TaskHelper Pro</text>
  <text x="730" y="216" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)">Read: Email · Contacts</text>
  <text x="730" y="230" font-family="monospace" font-size="7" fill="rgba(251,191,36,0.5)">Last used: 8 months ago</text>
  <!-- Status badge -->
  <rect x="1048" y="192" width="80" height="18" rx="4" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.35)" stroke-width="1"/>
  <text x="1088" y="205" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.7)" text-anchor="middle" letter-spacing="1">STALE</text>

  <!-- ─── ROW 3: Old + broad access (red) ─── -->
  <line x1="730" y1="246" x2="1138" y2="246" stroke="#1e3560" stroke-width="1"/>
  <text x="730" y="264" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.5)">SurveyMonkey2021</text>
  <text x="730" y="278" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.4)">Read: All email · All contacts · Drive</text>
  <text x="730" y="292" font-family="monospace" font-size="7" fill="rgba(239,68,68,0.5)">Last used: 2 years ago</text>
  <!-- Status badge -->
  <rect x="1040" y="254" width="88" height="18" rx="4" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>
  <text x="1084" y="267" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.75)" text-anchor="middle" letter-spacing="1">REVOKE</text>

  <!-- ─── ROW 4: Unknown old app (red) ─── -->
  <line x1="730" y1="308" x2="1138" y2="308" stroke="#1e3560" stroke-width="1"/>
  <text x="730" y="326" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">DataExport2021</text>
  <text x="730" y="340" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.35)">Read: Full account access</text>
  <text x="730" y="354" font-family="monospace" font-size="7" fill="rgba(239,68,68,0.45)">Last used: 3 years ago · company acquired</text>
  <!-- Status badge -->
  <rect x="1040" y="316" width="88" height="18" rx="4" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.5)" stroke-width="1"/>
  <text x="1084" y="329" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.85)" text-anchor="middle" letter-spacing="1">REVOKE</text>

  <!-- ─── ROW 5: Active, narrow scope (green) ─── -->
  <line x1="730" y1="370" x2="1138" y2="370" stroke="#1e3560" stroke-width="1"/>
  <text x="730" y="388" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.65)">Calendar Widget</text>
  <text x="730" y="402" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)">Read: Calendar (free/busy only)</text>
  <text x="730" y="416" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.2)">Last used: yesterday</text>
  <!-- Status badge -->
  <rect x="1056" y="378" width="72" height="18" rx="4" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
  <text x="1092" y="391" font-family="monospace" font-size="8" fill="rgba(34,197,94,0.75)" text-anchor="middle" letter-spacing="1">ACTIVE</text>

  <!-- ─── ROW 6: Never-used forgotten app (amber) ─── -->
  <line x1="730" y1="432" x2="1138" y2="432" stroke="#1e3560" stroke-width="1"/>
  <text x="730" y="450" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.38)">OldJobPortal</text>
  <text x="730" y="464" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.22)">Read: Profile · Email</text>
  <text x="730" y="478" font-family="monospace" font-size="7" fill="rgba(251,191,36,0.45)">Last used: 18 months ago</text>
  <!-- Status badge -->
  <rect x="1048" y="440" width="80" height="18" rx="4" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
  <text x="1088" y="453" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.65)" text-anchor="middle" letter-spacing="1">STALE</text>

  <!-- Panel footer -->
  <line x1="718" y1="498" x2="1150" y2="498" stroke="#1e3560" stroke-width="1"/>
  <text x="730" y="520" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.2)">Review tip: revoke anything unused · broad · unrecognized</text>
  <text x="730" y="536" font-family="monospace" font-size="8" fill="rgba(59,130,246,0.45)">myaccount.google.com → Security → Third-party apps</text>
  <text x="730" y="552" font-family="monospace" font-size="8" fill="rgba(59,130,246,0.35)">appleid.apple.com → Security → Apps Using Apple ID</text>
</svg>
