<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#0e1d3a"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111f40"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#3b82f6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="50" fill="white">The hidden account</text>
  <text x="76" y="250" font-family="Georgia, serif" font-size="50" fill="white">setting attackers</text>
  <text x="76" y="312" font-family="Georgia, serif" font-size="50" fill="white">configure after</text>
  <text x="76" y="374" font-family="Georgia, serif" font-size="50" fill="white">they get in</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-25  ·  accounts  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Forwarding rule diagram ── -->

  <!-- Main panel -->
  <rect x="718" y="72" width="432" height="498" rx="12" fill="url(#panelGrad)" stroke="#1e3560" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="718" y="72" width="432" height="40" rx="12" fill="#0f1e3a"/>
  <rect x="718" y="98" width="432" height="14" fill="#0f1e3a"/>
  <text x="934" y="98" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="2">EMAIL FORWARDING RULE</text>

  <!-- Timeline: Password changed → rule still fires -->
  <text x="730" y="128" font-family="monospace" font-size="7.5" fill="rgba(239,68,68,0.5)" letter-spacing="1">HOW IT WORKS</text>
  <line x1="730" y1="134" x2="1138" y2="134" stroke="#1e3560" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="730" y="140" width="3" height="58" fill="rgba(239,68,68,0.7)"/>
  <text x="742" y="157" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.45)" letter-spacing="1">ATTACKER LOGS IN</text>
  <text x="742" y="171" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Creates a forwarding rule in settings</text>
  <text x="742" y="185" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.3)">Takes ~30 seconds · buried in preferences</text>

  <!-- Step 2 -->
  <line x1="730" y1="198" x2="1138" y2="198" stroke="#1e3560" stroke-width="1"/>
  <rect x="730" y="198" width="3" height="58" fill="rgba(251,191,36,0.6)"/>
  <text x="742" y="215" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.45)" letter-spacing="1">YOU CHANGE YOUR PASSWORD</text>
  <text x="742" y="229" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Attacker locked out of the interface</text>
  <text x="742" y="243" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.3)">You feel like the incident is resolved</text>

  <!-- Step 3 — rule still fires -->
  <line x1="730" y1="256" x2="1138" y2="256" stroke="#1e3560" stroke-width="1"/>
  <rect x="730" y="256" width="3" height="70" fill="rgba(239,68,68,0.85)"/>
  <text x="742" y="273" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.55)" letter-spacing="1">EVERY EMAIL YOU RECEIVE</text>
  <text x="742" y="287" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">A copy silently goes to the attacker</text>
  <text x="742" y="301" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.3)">Password resets · bank alerts · 2FA codes</text>
  <text x="742" y="315" font-family="monospace" font-size="7" fill="rgba(239,68,68,0.45)">You see nothing unusual · no warning signs</text>

  <!-- Divider -->
  <line x1="730" y1="336" x2="1138" y2="336" stroke="rgba(59,130,246,0.1)" stroke-width="1"/>

  <!-- Where to check -->
  <text x="730" y="354" font-family="monospace" font-size="7.5" fill="rgba(59,130,246,0.6)" letter-spacing="1">WHERE TO CHECK</text>

  <!-- Gmail -->
  <rect x="730" y="362" width="190" height="100" rx="6" fill="rgba(59,130,246,0.05)" stroke="rgba(59,130,246,0.18)" stroke-width="1"/>
  <text x="825" y="380" font-family="monospace" font-size="8" fill="rgba(59,130,246,0.5)" text-anchor="middle" letter-spacing="1">GMAIL</text>
  <text x="740" y="397" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.4)">Settings → See all settings</text>
  <text x="740" y="412" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.4)">→ Forwarding and POP/IMAP</text>
  <text x="740" y="427" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.4)">Also: Filters tab → look for</text>
  <text x="740" y="442" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.4)">"Forward to" in any filter</text>
  <text x="740" y="455" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.22)">Also check: mark-as-read + delete filters</text>

  <!-- Outlook -->
  <rect x="930" y="362" width="190" height="100" rx="6" fill="rgba(59,130,246,0.05)" stroke="rgba(59,130,246,0.18)" stroke-width="1"/>
  <text x="1025" y="380" font-family="monospace" font-size="8" fill="rgba(59,130,246,0.5)" text-anchor="middle" letter-spacing="1">OUTLOOK</text>
  <text x="940" y="397" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.4)">Settings → Mail → Forwarding</text>
  <text x="940" y="412" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.4)">Toggle: Enable forwarding</text>
  <text x="940" y="427" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.4)">Also: Settings → Mail → Rules</text>
  <text x="940" y="442" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.4)">Delete/redirect rules → remove</text>
  <text x="940" y="455" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.22)">Delete-message rules hide the trail</text>

  <!-- Footer -->
  <line x1="718" y1="472" x2="1150" y2="472" stroke="#1e3560" stroke-width="1"/>
  <text x="730" y="492" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.25)">Also audit: recovery email/phone · connected apps · reply-to address</text>
  <text x="730" y="508" font-family="monospace" font-size="7.5" fill="rgba(59,130,246,0.4)">Changing your password does NOT remove forwarding rules</text>
  <text x="730" y="524" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.18)">Takes 2 minutes to check · worth doing even if nothing seems wrong</text>
  <text x="730" y="540" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.15)">Attackers don't need to stay logged in if the mail arrives on its own</text>
</svg>
