<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#0e1d3a"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111f40"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#3b82f6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="52" fill="white">What happens to</text>
  <text x="76" y="252" font-family="Georgia, serif" font-size="52" fill="white">your passwords if</text>
  <text x="76" y="316" font-family="Georgia, serif" font-size="52" fill="white">the password</text>
  <text x="76" y="380" font-family="Georgia, serif" font-size="52" fill="white">manager goes down</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-26  ·  password-managers  ·  accounts  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Two-column architecture comparison ── -->

  <!-- Main panel -->
  <rect x="718" y="72" width="432" height="498" rx="12" fill="url(#panelGrad)" stroke="#1e3560" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="718" y="72" width="432" height="40" rx="12" fill="#0f1e3a"/>
  <rect x="718" y="98" width="432" height="14" fill="#0f1e3a"/>
  <text x="934" y="98" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="2">VAULT ARCHITECTURE</text>

  <!-- Column headers -->
  <text x="810" y="128" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.65)" text-anchor="middle" letter-spacing="1">CLOUD-SYNCED</text>
  <text x="1034" y="128" font-family="monospace" font-size="8" fill="rgba(59,130,246,0.65)" text-anchor="middle" letter-spacing="1">LOCAL-FIRST</text>

  <!-- Vertical divider -->
  <line x1="924" y1="114" x2="924" y2="460" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="730" y1="136" x2="1138" y2="136" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Row: where vault lives -->
  <text x="730" y="154" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.3)" letter-spacing="1">VAULT LIVES</text>
  <text x="730" y="168" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Provider's servers</text>
  <text x="730" y="181" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)">downloaded to device</text>
  <text x="934" y="168" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Your device / sync folder</text>
  <text x="934" y="181" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)">provider not in the loop</text>

  <line x1="730" y1="192" x2="1138" y2="192" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Row: offline access -->
  <text x="730" y="208" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.3)" letter-spacing="1">OFFLINE ACCESS</text>
  <text x="730" y="222" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Cached copy works</text>
  <text x="730" y="235" font-family="monospace" font-size="7" fill="rgba(251,191,36,0.5)">New device: need connection</text>
  <text x="934" y="222" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Full access, always</text>
  <text x="934" y="235" font-family="monospace" font-size="7" fill="rgba(59,130,246,0.5)">Vault file is on your device</text>

  <line x1="730" y1="248" x2="1138" y2="248" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Row: if service shuts down -->
  <text x="730" y="264" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.3)" letter-spacing="1">SERVICE SHUTS DOWN</text>
  <text x="730" y="278" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Export window (usually)</text>
  <text x="730" y="291" font-family="monospace" font-size="7" fill="rgba(239,68,68,0.45)">Export early — don't wait</text>
  <text x="934" y="278" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Vault file remains yours</text>
  <text x="934" y="291" font-family="monospace" font-size="7" fill="rgba(59,130,246,0.5)">Access unaffected</text>

  <line x1="730" y1="304" x2="1138" y2="304" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Row: sync -->
  <text x="730" y="320" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.3)" letter-spacing="1">CROSS-DEVICE SYNC</text>
  <text x="730" y="334" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Automatic via provider</text>
  <text x="730" y="347" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)">requires active subscription</text>
  <text x="934" y="334" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Via method you choose</text>
  <text x="934" y="347" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)">cloud folder, relay, manual</text>

  <!-- Export box -->
  <line x1="730" y1="362" x2="1138" y2="362" stroke="rgba(59,130,246,0.1)" stroke-width="1"/>
  <text x="730" y="380" font-family="monospace" font-size="7.5" fill="rgba(59,130,246,0.55)" letter-spacing="1">EXPORT — WHAT IT IS AND ISN'T</text>

  <text x="730" y="397" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.45)">A point-in-time snapshot — immediately starts going stale.</text>
  <text x="730" y="413" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.3)">CSV = portable but plaintext — store encrypted, not on desktop</text>
  <text x="730" y="429" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.3)">Proprietary format = safer to store, may only re-import to same app</text>
  <text x="730" y="447" font-family="monospace" font-size="7.5" fill="rgba(251,191,36,0.45)">Best practice: run a periodic export, store outside the app</text>

  <!-- Footer -->
  <line x1="718" y1="462" x2="1150" y2="462" stroke="#1e3560" stroke-width="1"/>
  <text x="730" y="482" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.25)">Know where your vault file actually lives on disk</text>
  <text x="730" y="498" font-family="monospace" font-size="7.5" fill="rgba(59,130,246,0.4)">New device recovery: think through the circular dependency before it's a crisis</text>
  <text x="730" y="514" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.15)">A PM that can hold credentials hostage defeats the purpose of having one</text>
  <text x="730" y="530" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.13)">Review data access terms before committing to any service</text>
</svg>
