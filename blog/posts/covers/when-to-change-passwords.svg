<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#051a18"/>
      <stop offset="100%" stop-color="#0a2d28"/>
    </linearGradient>
    <linearGradient id="calGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2e28"/>
      <stop offset="100%" stop-color="#081e1a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2820"/>
      <stop offset="100%" stop-color="#081a14"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#14b8a6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="54" fill="white">You don't need to</text>
  <text x="76" y="254" font-family="Georgia, serif" font-size="54" fill="white">change your</text>
  <text x="76" y="320" font-family="Georgia, serif" font-size="54" fill="white">password every</text>
  <text x="76" y="386" font-family="Georgia, serif" font-size="54" fill="white">90 days</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-06  ·  passwords  ·  myths  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Calendar crossed out + password mutation illustration ── -->

  <!-- Calendar body -->
  <rect x="730" y="80" width="260" height="280" rx="12" fill="url(#calGrad)" stroke="#1a4038" stroke-width="1.5"/>

  <!-- Calendar header -->
  <rect x="730" y="80" width="260" height="48" rx="12" fill="#0d3530"/>
  <rect x="730" y="112" width="260" height="16" fill="#0d3530"/>
  <text x="790" y="110" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.6)" letter-spacing="2">90 DAYS</text>

  <!-- Calendar binding rings -->
  <circle cx="780" cy="80" r="8" fill="none" stroke="#1a4038" stroke-width="2"/>
  <circle cx="860" cy="80" r="8" fill="none" stroke="#1a4038" stroke-width="2"/>
  <circle cx="940" cy="80" r="8" fill="none" stroke="#1a4038" stroke-width="2"/>

  <!-- Calendar grid (day numbers) -->
  <g font-family="monospace" font-size="13" fill="rgba(255,255,255,0.25)">
    <!-- Row 1 -->
    <text x="748" y="160">01</text><text x="788" y="160">02</text><text x="828" y="160">03</text><text x="868" y="160">04</text><text x="908" y="160">05</text><text x="948" y="160">06</text>
    <!-- Row 2 -->
    <text x="748" y="190">07</text><text x="788" y="190">08</text><text x="828" y="190">09</text><text x="868" y="190">10</text><text x="908" y="190">11</text><text x="948" y="190">12</text>
    <!-- Row 3 -->
    <text x="748" y="220">13</text><text x="788" y="220">14</text><text x="828" y="220">15</text><text x="868" y="220">16</text><text x="908" y="220">17</text><text x="948" y="220">18</text>
    <!-- Row 4 -->
    <text x="748" y="250">19</text><text x="788" y="250">20</text><text x="828" y="250">21</text><text x="868" y="250">22</text><text x="908" y="250">23</text><text x="948" y="250">24</text>
    <!-- Row 5 -->
    <text x="748" y="280">25</text><text x="788" y="280">26</text><text x="828" y="280">27</text><text x="868" y="280">28</text><text x="908" y="280">29</text><text x="948" y="280">30</text>
    <!-- Day 90 highlighted -->
    <text x="868" y="340" fill="rgba(20,184,166,0.5)">90</text>
  </g>

  <!-- Big red X over calendar -->
  <line x1="740" y1="90" x2="980" y2="350" stroke="rgba(239,68,68,0.65)" stroke-width="8" stroke-linecap="round"/>
  <line x1="980" y1="90" x2="740" y2="350" stroke="rgba(239,68,68,0.65)" stroke-width="8" stroke-linecap="round"/>

  <!-- Password mutation sequence cards -->
  <!-- Label -->
  <text x="730" y="400" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)" letter-spacing="2">WHAT PEOPLE ACTUALLY DO</text>

  <!-- Card 1: Summer2024! -->
  <rect x="730" y="412" width="148" height="32" rx="6" fill="url(#cardGrad)" stroke="#1a4038" stroke-width="1"/>
  <text x="742" y="432" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.6)">Summer2024!</text>

  <!-- Arrow -->
  <line x1="882" y1="428" x2="898" y2="428" stroke="rgba(20,184,166,0.4)" stroke-width="2" stroke-linecap="round"/>
  <polyline points="894,422 900,428 894,434" fill="none" stroke="rgba(20,184,166,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 2: Fall2024! -->
  <rect x="904" y="412" width="122" height="32" rx="6" fill="url(#cardGrad)" stroke="#1a4038" stroke-width="1"/>
  <text x="916" y="432" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.6)">Fall2024!</text>

  <!-- Second row -->
  <!-- Card 3: Winter2025! -->
  <rect x="730" y="458" width="148" height="32" rx="6" fill="url(#cardGrad)" stroke="#1a4038" stroke-width="1"/>
  <text x="742" y="478" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.5)">Winter2025!</text>

  <!-- Arrow -->
  <line x1="882" y1="474" x2="898" y2="474" stroke="rgba(20,184,166,0.3)" stroke-width="2" stroke-linecap="round"/>
  <polyline points="894,468 900,474 894,480" fill="none" stroke="rgba(20,184,166,0.3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 4: Spring2025! -->
  <rect x="904" y="458" width="138" height="32" rx="6" fill="url(#cardGrad)" stroke="#1a4038" stroke-width="1"/>
  <text x="916" y="478" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.5)">Spring2025!</text>

  <!-- Strikethrough over the mutation sequence -->
  <line x1="728" y1="408" x2="1050" y2="496" stroke="rgba(239,68,68,0.4)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,5"/>

  <!-- NIST label at bottom -->
  <text x="730" y="540" font-family="monospace" font-size="10" fill="rgba(20,184,166,0.45)" letter-spacing="1">NIST SP 800-63B: change when compromised,</text>
  <text x="730" y="556" font-family="monospace" font-size="10" fill="rgba(20,184,166,0.45)" letter-spacing="1">not on a schedule.</text>
</svg>
