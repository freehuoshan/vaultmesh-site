<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07130f"/>
      <stop offset="100%" stop-color="#0e2018"/>
    </linearGradient>
    <linearGradient id="formGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102218"/>
      <stop offset="100%" stop-color="#091810"/>
    </linearGradient>
    <linearGradient id="profileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f18"/>
      <stop offset="100%" stop-color="#091510"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#10b981"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="56" fill="white">Why security</text>
  <text x="76" y="256" font-family="Georgia, serif" font-size="56" fill="white">questions are</text>
  <text x="76" y="324" font-family="Georgia, serif" font-size="56" fill="white">often the</text>
  <text x="76" y="392" font-family="Georgia, serif" font-size="56" fill="white">weakest link</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-06-29  ·  passwords  ·  accounts  ·  myths  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Security question form + social profile reveal ── -->

  <!-- Security question form panel -->
  <rect x="720" y="80" width="280" height="340" rx="10" fill="url(#formGrad)" stroke="#1a4030" stroke-width="1.5"/>

  <!-- Form header bar -->
  <rect x="720" y="80" width="280" height="36" rx="10" fill="#163328"/>
  <rect x="720" y="100" width="280" height="16" fill="#163328"/>
  <text x="736" y="102" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1">SECURITY QUESTIONS</text>

  <!-- Form field 1 -->
  <text x="736" y="140" font-family="monospace" font-size="10" fill="rgba(16,185,129,0.7)">What is your mother's maiden name?</text>
  <rect x="736" y="148" width="248" height="22" rx="4" fill="rgba(0,0,0,0.3)" stroke="#1a4030" stroke-width="1"/>
  <text x="744" y="163" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)">Walsh</text>

  <!-- Form field 2 -->
  <text x="736" y="196" font-family="monospace" font-size="10" fill="rgba(16,185,129,0.7)">What was your first pet's name?</text>
  <rect x="736" y="204" width="248" height="22" rx="4" fill="rgba(0,0,0,0.3)" stroke="#1a4030" stroke-width="1"/>
  <text x="744" y="219" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)">Biscuit</text>

  <!-- Form field 3 -->
  <text x="736" y="252" font-family="monospace" font-size="10" fill="rgba(16,185,129,0.7)">What city were you born in?</text>
  <rect x="736" y="260" width="248" height="22" rx="4" fill="rgba(0,0,0,0.3)" stroke="#1a4030" stroke-width="1"/>
  <text x="744" y="275" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)">Portland</text>

  <!-- Form field 4 -->
  <text x="736" y="308" font-family="monospace" font-size="10" fill="rgba(16,185,129,0.7)">What was your first car?</text>
  <rect x="736" y="316" width="248" height="22" rx="4" fill="rgba(0,0,0,0.3)" stroke="#1a4030" stroke-width="1"/>
  <text x="744" y="331" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.5)">Civic</text>

  <!-- Social media profile panel -->
  <rect x="726" y="432" width="268" height="148" rx="10" fill="url(#profileGrad)" stroke="#1a4030" stroke-width="1.5"/>

  <!-- Profile header -->
  <circle cx="760" cy="460" r="18" fill="#163328" stroke="#1a4030" stroke-width="1"/>
  <!-- Person silhouette -->
  <circle cx="760" cy="454" r="7" fill="rgba(16,185,129,0.4)"/>
  <path d="M748 475 Q760 466 772 475" fill="rgba(16,185,129,0.3)" stroke="none"/>

  <rect x="784" y="448" width="90" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="784" y="460" width="60" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>

  <!-- Profile posts with leaked info highlighted -->
  <rect x="736" y="484" width="248" height="30" rx="4" fill="rgba(0,0,0,0.2)"/>
  <text x="744" y="496" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.35)">Hometown: Portland · High School: Lincoln</text>
  <text x="744" y="508" font-family="monospace" font-size="9" fill="rgba(16,185,129,0.6)">🔍 findable</text>

  <rect x="736" y="520" width="248" height="30" rx="4" fill="rgba(0,0,0,0.2)"/>
  <text x="744" y="532" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.35)">"Miss you Biscuit" — family photo, 2019</text>
  <text x="744" y="544" font-family="monospace" font-size="9" fill="rgba(16,185,129,0.6)">🔍 findable</text>

  <!-- Warning arrow connecting form to profile -->
  <line x1="860" y1="420" x2="860" y2="432" stroke="rgba(16,185,129,0.5)" stroke-width="2" stroke-dasharray="4,3"/>
  <!-- Arrow label -->
  <text x="868" y="428" font-family="monospace" font-size="9" fill="rgba(16,185,129,0.5)">same data</text>

  <!-- Warning triangle / exposure indicator -->
  <polygon points="1050,130 1080,185 1020,185" fill="none" stroke="rgba(239,68,68,0.5)" stroke-width="2" stroke-linejoin="round"/>
  <text x="1046" y="177" font-family="monospace" font-size="18" fill="rgba(239,68,68,0.6)">!</text>

  <!-- Exposure label -->
  <text x="1008" y="206" font-family="monospace" font-size="10" fill="rgba(239,68,68,0.45)" letter-spacing="1">EXPOSED</text>

  <!-- Connecting dots / lines showing data match -->
  <circle cx="790" cy="163" r="3" fill="rgba(16,185,129,0.6)"/>
  <circle cx="790" cy="219" r="3" fill="rgba(16,185,129,0.6)"/>
  <circle cx="790" cy="275" r="3" fill="rgba(16,185,129,0.6)"/>

  <line x1="1000" y1="163" x2="1008" y2="163" stroke="rgba(239,68,68,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="1000" y1="219" x2="1008" y2="219" stroke="rgba(239,68,68,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="1000" y1="275" x2="1008" y2="275" stroke="rgba(239,68,68,0.4)" stroke-width="1" stroke-dasharray="3,2"/>

  <rect x="1008" y="150" width="4" height="138" rx="2" fill="rgba(239,68,68,0.3)"/>
</svg>
