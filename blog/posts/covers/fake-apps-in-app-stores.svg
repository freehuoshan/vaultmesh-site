<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1005"/>
      <stop offset="100%" stop-color="#2d1a05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#f59e0b"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="54" fill="white">How to make sure</text>
  <text x="76" y="254" font-family="Georgia, serif" font-size="54" fill="white">you downloaded</text>
  <text x="76" y="320" font-family="Georgia, serif" font-size="54" fill="white">the real app</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-08-02  ·  phishing  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Real vs Fake comparison + 3 checks ── -->

  <!-- Check panel -->
  <rect x="718" y="72" width="432" height="290" rx="12" fill="rgba(245,158,11,0.04)" stroke="rgba(245,158,11,0.22)" stroke-width="1.5"/>
  <rect x="718" y="72" width="432" height="38" rx="12" fill="rgba(245,158,11,0.12)"/>
  <rect x="718" y="96" width="432" height="14" fill="rgba(245,158,11,0.12)"/>
  <text x="934" y="97" font-family="monospace" font-size="9" fill="rgba(245,158,11,0.7)" text-anchor="middle" letter-spacing="2">THE THREE CHECKS</text>

  <!-- Check 1 -->
  <rect x="730" y="116" width="3" height="58" fill="rgba(245,158,11,0.7)"/>
  <text x="742" y="133" font-family="monospace" font-size="7.5" fill="rgba(245,158,11,0.55)" letter-spacing="1">CHECK 1 — DEVELOPER NAME</text>
  <text x="742" y="148" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Published by the actual company — exactly, not a variation</text>
  <text x="742" y="162" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)">"Chase Mobile Solutions LLC" is not Chase Bank</text>

  <line x1="730" y1="178" x2="1138" y2="178" stroke="rgba(245,158,11,0.06)" stroke-width="1"/>

  <!-- Check 2 -->
  <rect x="730" y="180" width="3" height="58" fill="rgba(245,158,11,0.7)"/>
  <text x="742" y="197" font-family="monospace" font-size="7.5" fill="rgba(245,158,11,0.55)" letter-spacing="1">CHECK 2 — REVIEW COUNT</text>
  <text x="742" y="212" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Major app from established company: hundreds of thousands</text>
  <text x="742" y="226" font-family="monospace" font-size="7" fill="rgba(239,68,68,0.45)">47 five-star reviews on a banking app = red flag</text>
  <text x="742" y="238" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)">Raw count matters more than average rating — ratings can be fabricated</text>

  <line x1="730" y1="248" x2="1138" y2="248" stroke="rgba(245,158,11,0.06)" stroke-width="1"/>

  <!-- Check 3 -->
  <rect x="730" y="250" width="3" height="58" fill="rgba(34,197,94,0.65)"/>
  <text x="742" y="267" font-family="monospace" font-size="7.5" fill="rgba(34,197,94,0.55)" letter-spacing="1">CHECK 3 — CONFIRM VIA OFFICIAL WEBSITE</text>
  <text x="742" y="282" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.6)">Go to the company's website directly (type it yourself)</text>
  <text x="742" y="296" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)">Follow their download link to the store listing — that's the real app</text>
  <text x="742" y="308" font-family="monospace" font-size="7" fill="rgba(34,197,94,0.45)">Most reliable check: site link → store listing → install</text>

  <!-- Danger panel -->
  <rect x="718" y="378" width="432" height="190" rx="12" fill="rgba(239,68,68,0.04)" stroke="rgba(239,68,68,0.2)" stroke-width="1.5"/>
  <rect x="718" y="378" width="432" height="36" rx="12" fill="rgba(239,68,68,0.12)"/>
  <rect x="718" y="400" width="432" height="14" fill="rgba(239,68,68,0.12)"/>
  <text x="934" y="401" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.65)" text-anchor="middle" letter-spacing="2">HOW FAKE APPS FIND VICTIMS</text>

  <text x="730" y="430" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.45)">✗  App store search results — fakes appear alongside real apps</text>
  <text x="730" y="446" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.45)">✗  Links in emails or texts — never install via a link you received</text>
  <text x="730" y="462" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.45)">✗  Third-party sites / APK files — especially for banking or crypto</text>
  <text x="730" y="478" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.45)">✗  QR codes in physical spaces — look it up yourself instead</text>

  <line x1="730" y1="492" x2="1138" y2="492" stroke="rgba(239,68,68,0.08)" stroke-width="1"/>
  <text x="730" y="510" font-family="monospace" font-size="7.5" fill="rgba(245,158,11,0.45)">App updates arrive through the store — not through browser pop-ups</text>
  <text x="730" y="526" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.22)">"It's from the App Store" is necessary but not sufficient — verify the developer</text>
  <text x="730" y="542" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.18)">Damage happens before you realize it — fake banking app captures credentials on first login</text>
  <text x="730" y="558" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.15)">30 seconds: check developer · review count · confirm via official site</text>
</svg>
