<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#0e1d3a"/>
    </linearGradient>
    <linearGradient id="dieGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2f58"/>
      <stop offset="100%" stop-color="#0f1e40"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0a1830"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#3b82f6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="54" fill="white">Four random words:</text>
  <text x="76" y="254" font-family="Georgia, serif" font-size="54" fill="white">the passphrase</text>
  <text x="76" y="320" font-family="Georgia, serif" font-size="54" fill="white">that's stronger</text>
  <text x="76" y="386" font-family="Georgia, serif" font-size="54" fill="white">than it looks</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-02  ·  passwords  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Dice → words illustration ── -->

  <!-- Die 1 (top-left cluster) -->
  <rect x="730" y="90" width="72" height="72" rx="12" fill="url(#dieGrad)" stroke="#2a4f8a" stroke-width="2"/>
  <!-- 3 dots -->
  <circle cx="750" cy="110" r="5" fill="#3b82f6"/>
  <circle cx="766" cy="126" r="5" fill="#3b82f6"/>
  <circle cx="782" cy="142" r="5" fill="#3b82f6"/>

  <!-- Die 2 (offset right) -->
  <rect x="812" y="108" width="72" height="72" rx="12" fill="url(#dieGrad)" stroke="#2a4f8a" stroke-width="2"/>
  <!-- 5 dots -->
  <circle cx="830" cy="124" r="5" fill="#3b82f6"/>
  <circle cx="866" cy="124" r="5" fill="#3b82f6"/>
  <circle cx="848" cy="144" r="5" fill="#3b82f6"/>
  <circle cx="830" cy="164" r="5" fill="#3b82f6"/>
  <circle cx="866" cy="164" r="5" fill="#3b82f6"/>

  <!-- Die 3 (bottom-left) -->
  <rect x="740" y="174" width="72" height="72" rx="12" fill="url(#dieGrad)" stroke="#2a4f8a" stroke-width="2"/>
  <!-- 4 dots -->
  <circle cx="758" cy="192" r="5" fill="#3b82f6"/>
  <circle cx="794" cy="192" r="5" fill="#3b82f6"/>
  <circle cx="758" cy="228" r="5" fill="#3b82f6"/>
  <circle cx="794" cy="228" r="5" fill="#3b82f6"/>

  <!-- Die 4 (bottom-right) -->
  <rect x="820" y="192" width="72" height="72" rx="12" fill="url(#dieGrad)" stroke="#2a4f8a" stroke-width="2"/>
  <!-- 2 dots -->
  <circle cx="838" cy="208" r="5" fill="#3b82f6"/>
  <circle cx="874" cy="248" r="5" fill="#3b82f6"/>

  <!-- Die 5 (center bottom) -->
  <rect x="776" y="268" width="60" height="60" rx="10" fill="url(#dieGrad)" stroke="#2a4f8a" stroke-width="1.5"/>
  <!-- 6 dots -->
  <circle cx="791" cy="283" r="4" fill="#3b82f6"/>
  <circle cx="821" cy="283" r="4" fill="#3b82f6"/>
  <circle cx="791" cy="298" r="4" fill="#3b82f6"/>
  <circle cx="821" cy="298" r="4" fill="#3b82f6"/>
  <circle cx="791" cy="313" r="4" fill="#3b82f6"/>
  <circle cx="821" cy="313" r="4" fill="#3b82f6"/>

  <!-- Arrow: dice → words -->
  <line x1="910" y1="210" x2="960" y2="210" stroke="rgba(59,130,246,0.5)" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="952,202 962,210 952,218" fill="none" stroke="rgba(59,130,246,0.5)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Word cards (stacked vertically, right side) -->
  <!-- Card 1: correct -->
  <rect x="970" y="82" width="180" height="46" rx="8" fill="url(#cardGrad)" stroke="#2a4f8a" stroke-width="1.5"/>
  <text x="986" y="113" font-family="monospace" font-size="20" fill="rgba(255,255,255,0.85)" letter-spacing="1">correct</text>

  <!-- Card 2: horse -->
  <rect x="970" y="140" width="180" height="46" rx="8" fill="url(#cardGrad)" stroke="#2a4f8a" stroke-width="1.5"/>
  <text x="986" y="171" font-family="monospace" font-size="20" fill="rgba(255,255,255,0.85)" letter-spacing="1">horse</text>

  <!-- Card 3: battery -->
  <rect x="970" y="198" width="180" height="46" rx="8" fill="url(#cardGrad)" stroke="#2a4f8a" stroke-width="1.5"/>
  <text x="986" y="229" font-family="monospace" font-size="20" fill="rgba(255,255,255,0.85)" letter-spacing="1">battery</text>

  <!-- Card 4: staple -->
  <rect x="970" y="256" width="180" height="46" rx="8" fill="url(#cardGrad)" stroke="#2a4f8a" stroke-width="1.5"/>
  <text x="986" y="287" font-family="monospace" font-size="20" fill="rgba(255,255,255,0.85)" letter-spacing="1">staple</text>

  <!-- Connector lines from arrow to cards -->
  <line x1="962" y1="210" x2="970" y2="105" stroke="rgba(59,130,246,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="962" y1="210" x2="970" y2="163" stroke="rgba(59,130,246,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="962" y1="210" x2="970" y2="221" stroke="rgba(59,130,246,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="962" y1="210" x2="970" y2="279" stroke="rgba(59,130,246,0.2)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Wordlist reference label -->
  <text x="970" y="330" font-family="monospace" font-size="9" fill="rgba(59,130,246,0.4)" letter-spacing="2">EFF WORDLIST</text>

  <!-- Passphrase result box at bottom -->
  <rect x="730" y="370" width="430" height="56" rx="10" fill="rgba(59,130,246,0.07)" stroke="rgba(59,130,246,0.25)" stroke-width="1.5"/>
  <text x="748" y="393" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.35)">PASSPHRASE</text>
  <text x="748" y="414" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.75)" letter-spacing="1">correct horse battery staple</text>

  <!-- Strength indicator bar -->
  <rect x="730" y="444" width="430" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="730" y="444" width="380" height="8" rx="4" fill="rgba(59,130,246,0.45)"/>
  <text x="730" y="468" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.25)" letter-spacing="1">STRENGTH</text>
  <text x="1100" y="468" font-family="monospace" font-size="9" fill="rgba(59,130,246,0.5)" letter-spacing="1">STRONG</text>

  <!-- Random = key label -->
  <text x="730" y="510" font-family="monospace" font-size="10" fill="rgba(59,130,246,0.35)" letter-spacing="2">RANDOM SELECTION = STRENGTH</text>
</svg>
