<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0519"/>
      <stop offset="100%" stop-color="#1a0a2d"/>
    </linearGradient>
    <linearGradient id="wireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(168,85,247,0.6)"/>
      <stop offset="50%" stop-color="rgba(168,85,247,0.15)"/>
      <stop offset="100%" stop-color="rgba(168,85,247,0.6)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#a855f7"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="54" fill="white">What end-to-end</text>
  <text x="76" y="254" font-family="Georgia, serif" font-size="54" fill="white">encrypted</text>
  <text x="76" y="320" font-family="Georgia, serif" font-size="54" fill="white">actually means</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-20  ·  habits  ·  myths  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE ── -->

  <!-- ── E2EE FLOW DIAGRAM ── -->

  <!-- SENDER phone box -->
  <rect x="718" y="72" width="100" height="130" rx="10" fill="rgba(168,85,247,0.07)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>
  <text x="768" y="92" font-family="monospace" font-size="8" fill="rgba(168,85,247,0.65)" text-anchor="middle" letter-spacing="1">SENDER</text>
  <line x1="728" y1="98" x2="808" y2="98" stroke="rgba(168,85,247,0.15)" stroke-width="1"/>
  <text x="728" y="116" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.4)">message:</text>
  <text x="728" y="130" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.55)">"Hey, free at 3?"</text>
  <line x1="728" y1="140" x2="808" y2="140" stroke="rgba(168,85,247,0.1)" stroke-width="1"/>
  <text x="728" y="155" font-family="monospace" font-size="6.5" fill="rgba(168,85,247,0.5)">encrypted on device</text>
  <text x="728" y="167" font-family="monospace" font-size="6.5" fill="rgba(168,85,247,0.5)">before sending</text>
  <text x="728" y="196" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.2)">▾ encrypted</text>

  <!-- Wire / encrypted transit -->
  <rect x="826" y="122" width="140" height="32" rx="5" fill="url(#wireGrad)" opacity="0.6"/>
  <text x="896" y="133" font-family="monospace" font-size="6" fill="rgba(168,85,247,0.4)" text-anchor="middle">IN TRANSIT</text>
  <text x="896" y="146" font-family="monospace" font-size="6" fill="rgba(168,85,247,0.35)" text-anchor="middle">3f8a·c4b2·e7fa·091d</text>

  <!-- SERVER box (middle) -->
  <rect x="828" y="72" width="136" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="896" y="91" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="1">SERVICE SERVER</text>
  <text x="896" y="107" font-family="monospace" font-size="6.5" fill="rgba(34,197,94,0.5)" text-anchor="middle">sees: encrypted data only ✓</text>

  <!-- Arrow from sender to wire -->
  <line x1="818" y1="138" x2="826" y2="138" stroke="rgba(168,85,247,0.45)" stroke-width="1.5"/>
  <polygon points="826,134 834,138 826,142" fill="rgba(168,85,247,0.45)"/>

  <!-- Arrow from wire to recipient -->
  <line x1="966" y1="138" x2="974" y2="138" stroke="rgba(168,85,247,0.45)" stroke-width="1.5"/>
  <polygon points="974,134 982,138 974,142" fill="rgba(168,85,247,0.45)"/>

  <!-- RECIPIENT phone box -->
  <rect x="980" y="72" width="100" height="130" rx="10" fill="rgba(168,85,247,0.07)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>
  <text x="1030" y="92" font-family="monospace" font-size="8" fill="rgba(168,85,247,0.65)" text-anchor="middle" letter-spacing="1">RECIPIENT</text>
  <line x1="990" y1="98" x2="1070" y2="98" stroke="rgba(168,85,247,0.15)" stroke-width="1"/>
  <text x="990" y="116" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.4)">decrypted:</text>
  <text x="990" y="130" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.55)">"Hey, free at 3?"</text>
  <line x1="990" y1="140" x2="1070" y2="140" stroke="rgba(168,85,247,0.1)" stroke-width="1"/>
  <text x="990" y="155" font-family="monospace" font-size="6.5" fill="rgba(168,85,247,0.5)">decrypted on device</text>
  <text x="990" y="167" font-family="monospace" font-size="6.5" fill="rgba(168,85,247,0.5)">by recipient's key</text>

  <!-- ── WHAT IT DOESN'T COVER ── -->
  <line x1="718" y1="220" x2="1148" y2="220" stroke="rgba(168,85,247,0.1)" stroke-width="1"/>
  <text x="933" y="242" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.28)" text-anchor="middle" letter-spacing="2">WHAT E2EE DOESN'T COVER</text>

  <text x="726" y="266" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.5)">✗</text>
  <text x="742" y="266" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Unlocked device — anyone with physical access sees messages</text>

  <text x="726" y="286" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.5)">✗</text>
  <text x="742" y="286" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Screenshots — recipient can capture and share anything</text>

  <text x="726" y="306" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.5)">✗</text>
  <text x="742" y="306" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Metadata — who messaged whom, when, how often</text>

  <text x="726" y="326" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.5)">✗</text>
  <text x="742" y="326" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Unencrypted cloud backups of your message history</text>

  <!-- ── APP COMPARISON ── -->
  <line x1="718" y1="348" x2="1148" y2="348" stroke="rgba(168,85,247,0.1)" stroke-width="1"/>
  <text x="933" y="370" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.28)" text-anchor="middle" letter-spacing="2">APP STATUS</text>

  <!-- App rows -->
  <text x="726" y="394" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)">Signal</text>
  <rect x="902" y="382" width="112" height="16" rx="3" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="958" y="394" font-family="monospace" font-size="7" fill="rgba(34,197,94,0.7)" text-anchor="middle">E2EE by default</text>

  <text x="726" y="416" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)">iMessage</text>
  <rect x="902" y="404" width="112" height="16" rx="3" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="958" y="416" font-family="monospace" font-size="7" fill="rgba(34,197,94,0.7)" text-anchor="middle">E2EE (blue only)</text>
  <text x="726" y="428" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)">SMS fallback (green bubbles) = no encryption</text>

  <text x="726" y="450" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)">WhatsApp</text>
  <rect x="902" y="438" width="112" height="16" rx="3" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="958" y="450" font-family="monospace" font-size="7" fill="rgba(34,197,94,0.7)" text-anchor="middle">E2EE by default</text>

  <text x="726" y="472" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)">Telegram</text>
  <rect x="902" y="460" width="112" height="16" rx="3" fill="rgba(251,191,36,0.1)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
  <text x="958" y="472" font-family="monospace" font-size="7" fill="rgba(251,191,36,0.65)" text-anchor="middle">Secret Chats only</text>
  <text x="726" y="484" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)">Regular chats stored on Telegram servers</text>

  <text x="726" y="506" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.45)">SMS / email</text>
  <rect x="902" y="494" width="112" height="16" rx="3" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
  <text x="958" y="506" font-family="monospace" font-size="7" fill="rgba(239,68,68,0.65)" text-anchor="middle">No E2EE</text>

  <!-- Footer -->
  <line x1="718" y1="526" x2="1148" y2="526" stroke="rgba(168,85,247,0.08)" stroke-width="1"/>
  <text x="733" y="546" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.18)">For sensitive conversations: Signal minimizes both content exposure and metadata</text>
  <text x="733" y="560" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.15)">Check backup settings: unencrypted iCloud/Google Drive backups bypass E2EE</text>
</svg>
