<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d0a0a"/>
      <stop offset="100%" stop-color="#0f0202"/>
    </linearGradient>
    <linearGradient id="cyl-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a1a1a"/>
      <stop offset="100%" stop-color="#5a1010"/>
    </linearGradient>
    <linearGradient id="cyl-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a0e0e"/>
      <stop offset="50%" stop-color="#5e1212"/>
      <stop offset="100%" stop-color="#3d0a0a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines for depth -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#e53935"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="97" font-family="monospace" font-size="13" letter-spacing="4" fill="#e53935" opacity="0.9">PASSWORD SENSE</text>

  <!-- Post title — wrapped to ≤28 chars per line -->
  <text x="76" y="200" font-family="Georgia, serif" font-size="54" fill="#ffffff" font-weight="normal">Your password was in a</text>
  <text x="76" y="266" font-family="Georgia, serif" font-size="54" fill="#ffffff" font-weight="normal">breach — here&#8217;s what</text>
  <text x="76" y="332" font-family="Georgia, serif" font-size="54" fill="#ffffff" font-weight="normal">actually matters next</text>

  <!-- Date, tags, wordmark -->
  <text x="76" y="582" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.3)" letter-spacing="1">2026-06-27 · breaches passwords 2fa habits · VAULTMESH</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- Right-side illustration: cracked database vault -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Database cylinder body -->
  <rect x="870" y="248" width="180" height="168" fill="url(#cyl-body)" rx="2"/>

  <!-- Top ellipse cap (lit) -->
  <ellipse cx="960" cy="248" rx="90" ry="24" fill="url(#cyl-top)"/>
  <!-- Top ellipse inner ring (label ring) -->
  <ellipse cx="960" cy="248" rx="90" ry="24" fill="none" stroke="#7a1a1a" stroke-width="2"/>
  <!-- Mid-body ring lines (database stripe) -->
  <line x1="870" y1="290" x2="1050" y2="290" stroke="#6a1515" stroke-width="1.5" opacity="0.8"/>
  <line x1="870" y1="332" x2="1050" y2="332" stroke="#6a1515" stroke-width="1.5" opacity="0.8"/>
  <line x1="870" y1="374" x2="1050" y2="374" stroke="#6a1515" stroke-width="1.5" opacity="0.8"/>

  <!-- Bottom ellipse cap (shadow) -->
  <ellipse cx="960" cy="416" rx="90" ry="24" fill="#3a0808"/>
  <ellipse cx="960" cy="416" rx="90" ry="24" fill="none" stroke="#5a1010" stroke-width="1.5"/>

  <!-- Crack 1 — main jagged fracture -->
  <path d="M938 248 L918 280 L942 285 L922 332 L932 332 L908 375 L916 375 L900 416"
        stroke="#e53935" stroke-width="2.5" fill="none" stroke-linejoin="round" opacity="0.95"/>

  <!-- Crack 2 — smaller branch -->
  <path d="M942 285 L962 298 L950 315 L968 330"
        stroke="#e53935" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Crack 3 — hairline on right side -->
  <path d="M1000 260 L1012 295 L998 310 L1010 340"
        stroke="#e53935" stroke-width="1" fill="none" opacity="0.45"/>

  <!-- Glow along main crack -->
  <path d="M938 248 L918 280 L942 285 L922 332 L932 332 L908 375 L916 375 L900 416"
        stroke="#ff6b6b" stroke-width="6" fill="none" opacity="0.12" stroke-linejoin="round"/>

  <!-- ─── Leaking data particles ─── -->
  <!-- Left side stream -->
  <circle cx="848" cy="278" r="5" fill="#e53935" opacity="0.85"/>
  <circle cx="826" cy="305" r="3.5" fill="#e53935" opacity="0.7"/>
  <circle cx="840" cy="338" r="4.5" fill="#ff7070" opacity="0.6"/>
  <circle cx="812" cy="360" r="2.5" fill="#e53935" opacity="0.55"/>
  <circle cx="795" cy="290" r="3" fill="#ff8080" opacity="0.45"/>
  <circle cx="778" cy="325" r="2" fill="#ff8080" opacity="0.35"/>
  <circle cx="762" cy="355" r="3" fill="#ff8080" opacity="0.3"/>
  <circle cx="748" cy="295" r="1.5" fill="#ff9090" opacity="0.25"/>

  <!-- Right side stream -->
  <circle cx="1076" cy="272" r="5" fill="#e53935" opacity="0.85"/>
  <circle cx="1095" cy="302" r="3.5" fill="#e53935" opacity="0.7"/>
  <circle cx="1082" cy="340" r="4.5" fill="#ff7070" opacity="0.6"/>
  <circle cx="1108" cy="365" r="2.5" fill="#e53935" opacity="0.55"/>
  <circle cx="1120" cy="285" r="3" fill="#ff8080" opacity="0.45"/>
  <circle cx="1138" cy="318" r="2" fill="#ff8080" opacity="0.35"/>
  <circle cx="1148" cy="350" r="3" fill="#ff8080" opacity="0.3"/>
  <circle cx="1155" cy="275" r="1.5" fill="#ff9090" opacity="0.25"/>

  <!-- Upper scatter — data escaping upward -->
  <circle cx="910" cy="208" r="3.5" fill="#e53935" opacity="0.6"/>
  <circle cx="960" cy="196" r="2.5" fill="#e53935" opacity="0.5"/>
  <circle cx="1010" cy="210" r="3" fill="#e53935" opacity="0.55"/>
  <circle cx="935" cy="182" r="2" fill="#ff8080" opacity="0.35"/>
  <circle cx="985" cy="175" r="1.5" fill="#ff8080" opacity="0.28"/>

  <!-- ─── Broken padlock below the cylinder ─── -->
  <!-- Lock body -->
  <rect x="935" y="465" width="50" height="40" rx="5" fill="#3a0808" stroke="#6a1212" stroke-width="2"/>
  <!-- Lock shackle — open/broken, right side swung away -->
  <path d="M945 465 Q945 440 960 440 Q975 440 975 458"
        stroke="#6a1212" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M975 458 Q976 452 982 448"
        stroke="#e53935" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Keyhole inside lock body -->
  <circle cx="960" cy="481" r="6" fill="#1a0404"/>
  <rect x="957" y="485" width="6" height="10" rx="1" fill="#1a0404"/>

  <!-- Small exclamation glyph on lock body -->
  <rect x="958" y="471" width="4" height="7" rx="1" fill="#e53935" opacity="0.8"/>
  <rect x="958" y="480" width="4" height="3" rx="1" fill="#e53935" opacity="0.8"/>

</svg>
