<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#0e1d3a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#3b82f6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="54" fill="white">How to share</text>
  <text x="76" y="254" font-family="Georgia, serif" font-size="54" fill="white">account access</text>
  <text x="76" y="320" font-family="Georgia, serif" font-size="54" fill="white">without sharing</text>
  <text x="76" y="386" font-family="Georgia, serif" font-size="54" fill="white">a password</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-10  ·  passwords  ·  habits  ·  password-managers  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Two paths illustration ── -->

  <!-- LEFT panel: Risky path (via chat/email) -->
  <rect x="718" y="72" width="195" height="500" rx="12" fill="rgba(239,68,68,0.04)" stroke="rgba(239,68,68,0.28)" stroke-width="1.5"/>
  <!-- Panel header -->
  <rect x="718" y="72" width="195" height="38" rx="12" fill="rgba(239,68,68,0.18)"/>
  <rect x="718" y="96" width="195" height="14" fill="rgba(239,68,68,0.18)"/>
  <text x="815" y="97" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.75)" text-anchor="middle" letter-spacing="2">VIA TEXT / EMAIL</text>

  <!-- Chat bubble: them asking -->
  <rect x="728" y="128" width="138" height="32" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="738" y="143" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.3)">What's the</text>
  <text x="738" y="155" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.3)">account password?</text>

  <!-- Chat bubble: reply with password -->
  <rect x="728" y="174" width="170" height="46" rx="8" fill="rgba(239,68,68,0.14)" stroke="rgba(239,68,68,0.35)" stroke-width="1"/>
  <text x="738" y="192" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.4)">Here you go:</text>
  <text x="738" y="210" font-family="monospace" font-size="14" fill="rgba(239,68,68,0.9)">S3cr3t!123</text>

  <!-- Warning box: stored forever -->
  <rect x="728" y="234" width="173" height="52" rx="5" fill="rgba(239,68,68,0.07)" stroke="rgba(239,68,68,0.22)" stroke-width="1"/>
  <text x="736" y="252" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.6)">⚠ stored in chat history</text>
  <text x="736" y="266" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)">searchable · never expires</text>
  <text x="736" y="280" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)">backed up · can be forwarded</text>

  <!-- Forwarded message -->
  <rect x="728" y="302" width="173" height="28" rx="6" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.15)" stroke-width="1"/>
  <text x="738" y="316" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.22)">Fwd: Here you go:</text>
  <text x="738" y="328" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.5)">S3cr3t!123</text>

  <!-- "EXPOSED" bottom label -->
  <text x="815" y="536" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.5)" text-anchor="middle" letter-spacing="2">EXPOSED</text>
  <text x="815" y="554" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.2)" text-anchor="middle">no way to take it back</text>

  <!-- VS divider -->
  <line x1="930" y1="92" x2="930" y2="558" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4,5"/>
  <rect x="910" y="298" width="42" height="24" rx="7" fill="#0a1428" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="931" y="315" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">vs</text>

  <!-- RIGHT panel: Safe path (via PM sharing) -->
  <rect x="950" y="72" width="200" height="500" rx="12" fill="rgba(34,197,94,0.04)" stroke="rgba(34,197,94,0.28)" stroke-width="1.5"/>
  <!-- Panel header -->
  <rect x="950" y="72" width="200" height="38" rx="12" fill="rgba(34,197,94,0.18)"/>
  <rect x="950" y="96" width="200" height="14" fill="rgba(34,197,94,0.18)"/>
  <text x="1050" y="97" font-family="monospace" font-size="9" fill="rgba(34,197,94,0.75)" text-anchor="middle" letter-spacing="2">VIA SHARED ENTRY</text>

  <!-- Vault entry card -->
  <rect x="960" y="122" width="180" height="68" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="970" y="140" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.3)" letter-spacing="1">VAULT ENTRY</text>
  <text x="970" y="158" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.6)">Streaming account</text>
  <text x="970" y="180" font-family="monospace" font-size="10" fill="rgba(34,197,94,0.4)">●●●●●●●●●●</text>

  <!-- Share arrow down -->
  <line x1="1050" y1="190" x2="1050" y2="210" stroke="rgba(34,197,94,0.45)" stroke-width="2" stroke-linecap="round"/>
  <polyline points="1043,204 1050,212 1057,204" fill="none" stroke="rgba(34,197,94,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Share link pill -->
  <rect x="960" y="214" width="180" height="40" rx="8" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.32)" stroke-width="1"/>
  <text x="1050" y="231" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="2">SHARE LINK</text>
  <text x="1050" y="247" font-family="monospace" font-size="7" fill="rgba(34,197,94,0.55)" text-anchor="middle">expires · one-time · revocable</text>

  <!-- Arrow down to recipient -->
  <line x1="1050" y1="254" x2="1050" y2="274" stroke="rgba(34,197,94,0.45)" stroke-width="2" stroke-linecap="round"/>
  <polyline points="1043,268 1050,276 1057,268" fill="none" stroke="rgba(34,197,94,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Recipient view card -->
  <rect x="960" y="278" width="180" height="60" rx="6" fill="rgba(34,197,94,0.07)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="970" y="297" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.28)" letter-spacing="1">RECIPIENT SEES</text>
  <text x="970" y="315" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.55)">Streaming account</text>
  <text x="970" y="332" font-family="monospace" font-size="8" fill="rgba(34,197,94,0.45)">auto-fills · password hidden</text>

  <!-- Revoke note -->
  <rect x="960" y="356" width="180" height="28" rx="5" fill="rgba(0,0,0,0.2)" stroke="rgba(34,197,94,0.12)" stroke-width="1"/>
  <text x="1050" y="375" font-family="monospace" font-size="8" fill="rgba(34,197,94,0.4)" text-anchor="middle">[ Revoke access ] — anytime</text>

  <!-- "CONTROLLED" bottom label -->
  <text x="1050" y="536" font-family="monospace" font-size="9" fill="rgba(34,197,94,0.55)" text-anchor="middle" letter-spacing="2">CONTROLLED</text>
  <text x="1050" y="554" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.2)" text-anchor="middle">revoke when done</text>
</svg>
