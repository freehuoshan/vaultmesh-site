<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#001214"/>
      <stop offset="100%" stop-color="#002530"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Right side: password strength comparison diagram -->

  <!-- COMPLEX label -->
  <text x="750" y="175" font-family="'Courier New',Courier,monospace" font-size="11" fill="#e05252" opacity="0.7" letter-spacing="2">COMPLEX</text>
  <!-- Short bar with jumbled symbols -->
  <rect x="750" y="185" width="148" height="38" rx="4" fill="#e05252" opacity="0.08"/>
  <rect x="750" y="185" width="148" height="38" rx="4" fill="none" stroke="#e05252" stroke-width="1.5" opacity="0.6"/>
  <text x="762" y="212" font-family="'Courier New',Courier,monospace" font-size="18" fill="#e05252" opacity="0.85">P@ssw0rd!1</text>
  <!-- X mark -->
  <line x1="912" y1="194" x2="920" y2="210" stroke="#e05252" stroke-width="2" opacity="0.5"/>
  <line x1="920" y1="194" x2="912" y2="210" stroke="#e05252" stroke-width="2" opacity="0.5"/>

  <!-- Divider -->
  <line x1="750" y1="256" x2="1140" y2="256" stroke="#0891b2" stroke-width="0.5" opacity="0.15"/>

  <!-- STRONG label -->
  <text x="750" y="298" font-family="'Courier New',Courier,monospace" font-size="11" fill="#0891b2" opacity="0.7" letter-spacing="2">STRONG</text>
  <!-- Long bar -->
  <rect x="750" y="308" width="370" height="38" rx="4" fill="#0891b2" opacity="0.08"/>
  <rect x="750" y="308" width="370" height="38" rx="4" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.6"/>
  <text x="762" y="334" font-family="'Courier New',Courier,monospace" font-size="15" fill="#0891b2" opacity="0.85">correct-horse-battery-staple</text>
  <!-- Check mark -->
  <path d="M 1132 318 L 1138 328 L 1150 310" stroke="#0891b2" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Length arrows / ruler showing difference -->
  <line x1="750" y1="386" x2="898" y2="386" stroke="#e05252" stroke-width="1" opacity="0.35"/>
  <line x1="750" y1="382" x2="750" y2="390" stroke="#e05252" stroke-width="1" opacity="0.35"/>
  <line x1="898" y1="382" x2="898" y2="390" stroke="#e05252" stroke-width="1" opacity="0.35"/>
  <text x="810" y="402" font-family="'Courier New',Courier,monospace" font-size="10" fill="#e05252" opacity="0.45" text-anchor="middle">10 chars</text>

  <line x1="750" y1="420" x2="1120" y2="420" stroke="#0891b2" stroke-width="1" opacity="0.35"/>
  <line x1="750"  y1="416" x2="750"  y2="424" stroke="#0891b2" stroke-width="1" opacity="0.35"/>
  <line x1="1120" y1="416" x2="1120" y2="424" stroke="#0891b2" stroke-width="1" opacity="0.35"/>
  <text x="935" y="436" font-family="'Courier New',Courier,monospace" font-size="10" fill="#0891b2" opacity="0.45" text-anchor="middle">28 chars</text>

  <!-- Subtle grid lines (background texture) -->
  <line x1="740" y1="130" x2="740" y2="510" stroke="#0891b2" stroke-width="0.4" opacity="0.08"/>
  <line x1="740" y1="460" x2="1170" y2="460" stroke="#0891b2" stroke-width="0.4" opacity="0.08"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#0891b2"/>
  <text x="80" y="100" font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="4" fill="#0891b2" opacity="0.7">PASSWORD SENSE</text>

  <!-- Title -->
  <text x="80" y="261" font-family="Georgia,'Times New Roman',serif" font-size="52" fill="#e8f7fa">Strong passwords vs</text>
  <text x="80" y="329" font-family="Georgia,'Times New Roman',serif" font-size="52" fill="#e8f7fa">complex passwords</text>
  <text x="80" y="397" font-family="Georgia,'Times New Roman',serif" font-size="52" fill="#e8f7fa">— not the same</text>

  <text x="80"   y="572" font-family="'Courier New',Courier,monospace" font-size="13" fill="#ffffff" opacity="0.3" letter-spacing="1">May 14, 2026  ·  passwords  ·  habits  ·  myths</text>
  <text x="1144" y="572" font-family="'Courier New',Courier,monospace" font-size="13" fill="#ffffff" opacity="0.3" text-anchor="end" letter-spacing="1">VAULTMESH</text>
</svg>
