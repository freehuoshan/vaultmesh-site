<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#0e1d3a"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111f40"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="promptGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162240"/>
      <stop offset="100%" stop-color="#0d1830"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#3b82f6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="54" fill="white">Browser-saved</text>
  <text x="76" y="254" font-family="Georgia, serif" font-size="54" fill="white">passwords:</text>
  <text x="76" y="320" font-family="Georgia, serif" font-size="54" fill="white">convenient, but</text>
  <text x="76" y="386" font-family="Georgia, serif" font-size="54" fill="white">at what cost?</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-01  ·  passwords  ·  accounts  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Browser window with save-password prompt ── -->

  <!-- Browser window frame -->
  <rect x="720" y="72" width="400" height="480" rx="12" fill="url(#browserGrad)" stroke="#1e3560" stroke-width="1.5"/>

  <!-- Browser chrome (title bar) -->
  <rect x="720" y="72" width="400" height="40" rx="12" fill="#0f1e3a"/>
  <rect x="720" y="96" width="400" height="16" fill="#0f1e3a"/>

  <!-- Traffic light dots -->
  <circle cx="748" cy="92" r="6" fill="#ff5f57" opacity="0.7"/>
  <circle cx="768" cy="92" r="6" fill="#febc2e" opacity="0.7"/>
  <circle cx="788" cy="92" r="6" fill="#28c840" opacity="0.7"/>

  <!-- Address bar -->
  <rect x="808" y="80" width="290" height="24" rx="6" fill="#0a1428" stroke="#1e3560" stroke-width="1"/>
  <!-- Padlock in address bar -->
  <rect x="816" y="87" width="7" height="9" rx="2" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
  <path d="M818,87 L818,84 A3.5,3.5 0 0,1 825,84 L825,87" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="828" y="97" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.45)">mybank.example.com</text>

  <!-- Page content (login form) -->
  <rect x="740" y="126" width="360" height="240" rx="0" fill="#0a1428"/>

  <!-- Form heading -->
  <rect x="800" y="148" width="120" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>

  <!-- Username field -->
  <rect x="770" y="172" width="280" height="28" rx="5" fill="#0f1e3a" stroke="#1e3560" stroke-width="1"/>
  <text x="782" y="190" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.35)">user@email.com</text>

  <!-- Password field -->
  <rect x="770" y="210" width="280" height="28" rx="5" fill="#0f1e3a" stroke="#1e3560" stroke-width="1"/>
  <!-- Dots for hidden password -->
  <circle cx="784" cy="224" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="796" cy="224" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="808" cy="224" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="820" cy="224" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="832" cy="224" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="844" cy="224" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="856" cy="224" r="3" fill="rgba(255,255,255,0.4)"/>

  <!-- Login button -->
  <rect x="770" y="252" width="280" height="30" rx="6" fill="#1d3a6e"/>
  <rect x="780" y="258" width="100" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="884" y="258" width="60" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>

  <!-- Page content lines below button -->
  <rect x="770" y="298" width="200" height="5" rx="2.5" fill="rgba(255,255,255,0.05)"/>
  <rect x="770" y="310" width="140" height="5" rx="2.5" fill="rgba(255,255,255,0.04)"/>

  <!-- "Save password?" prompt overlay -->
  <rect x="728" y="352" width="384" height="128" rx="10" fill="url(#promptGrad)" stroke="#2a4f8a" stroke-width="1.5"/>

  <!-- Prompt icon: key -->
  <g transform="translate(748, 370)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <rect x="12" y="-3" width="28" height="6" rx="2" fill="#3b82f6"/>
    <rect x="30" y="3" width="5" height="8" rx="1.5" fill="#3b82f6"/>
    <rect x="37" y="3" width="5" height="6" rx="1.5" fill="#3b82f6"/>
  </g>

  <!-- Prompt text -->
  <text x="778" y="374" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.8)" font-weight="bold">Save password?</text>
  <text x="748" y="396" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">mybank.example.com</text>
  <text x="748" y="412" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.3)">user@email.com</text>

  <!-- Prompt buttons -->
  <rect x="748" y="428" width="90" height="26" rx="6" fill="#1d3a6e" stroke="#2a4f8a" stroke-width="1"/>
  <text x="766" y="445" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.7)">Save</text>

  <rect x="852" y="428" width="90" height="26" rx="6" fill="rgba(0,0,0,0.2)" stroke="#1e3560" stroke-width="1"/>
  <text x="866" y="445" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.35)">Never</text>

  <rect x="956" y="428" width="90" height="26" rx="6" fill="rgba(0,0,0,0.2)" stroke="#1e3560" stroke-width="1"/>
  <text x="970" y="445" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.35)">Not now</text>

  <!-- Cloud sync indicator (top-right of browser) -->
  <g transform="translate(1050, 490)" opacity="0.5">
    <!-- Cloud shape -->
    <ellipse cx="30" cy="22" rx="28" ry="18" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <ellipse cx="14" cy="28" rx="12" ry="10" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <ellipse cx="46" cy="28" rx="12" ry="10" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Sync arrows -->
    <path d="M20,40 L20,52 L40,52 L40,40" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="35,44 40,40 45,44" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1048" y="558" font-family="monospace" font-size="9" fill="rgba(59,130,246,0.35)" letter-spacing="1">SYNCED</text>
</svg>
