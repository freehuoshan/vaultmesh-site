<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#0e1d3a"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111f40"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#3b82f6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="52" fill="white">Deleting an account</text>
  <text x="76" y="252" font-family="Georgia, serif" font-size="52" fill="white">is not the same</text>
  <text x="76" y="316" font-family="Georgia, serif" font-size="52" fill="white">as deleting</text>
  <text x="76" y="380" font-family="Georgia, serif" font-size="52" fill="white">your data</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-31  ·  accounts  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Deactivation vs Deletion comparison ── -->

  <!-- Main panel -->
  <rect x="718" y="72" width="432" height="498" rx="12" fill="url(#panelGrad)" stroke="#1e3560" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="718" y="72" width="432" height="40" rx="12" fill="#0f1e3a"/>
  <rect x="718" y="98" width="432" height="14" fill="#0f1e3a"/>
  <text x="934" y="98" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="2">DEACTIVATION vs DELETION</text>

  <!-- Column headers -->
  <text x="810" y="128" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.65)" text-anchor="middle" letter-spacing="1">DEACTIVATE</text>
  <text x="1034" y="128" font-family="monospace" font-size="8" fill="rgba(59,130,246,0.65)" text-anchor="middle" letter-spacing="1">DELETE</text>

  <line x1="924" y1="114" x2="924" y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="730" y1="136" x2="1138" y2="136" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Row: profile visibility -->
  <text x="730" y="152" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)" letter-spacing="1">PROFILE VISIBLE</text>
  <text x="730" y="166" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Hidden from others</text>
  <text x="934" y="166" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Removed</text>

  <line x1="730" y1="176" x2="1138" y2="176" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Row: your data -->
  <text x="730" y="192" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)" letter-spacing="1">YOUR DATA</text>
  <text x="730" y="206" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.6)">Still stored on servers</text>
  <text x="934" y="206" font-family="monospace" font-size="8" fill="rgba(34,197,94,0.6)">Purged (after 30–90 days)</text>

  <line x1="730" y1="218" x2="1138" y2="218" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Row: breach risk -->
  <text x="730" y="234" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)" letter-spacing="1">BREACH RISK</text>
  <text x="730" y="248" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.6)">Email + credentials remain</text>
  <text x="934" y="248" font-family="monospace" font-size="8" fill="rgba(34,197,94,0.6)">Removed from database</text>

  <line x1="730" y1="260" x2="1138" y2="260" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Row: reactivation -->
  <text x="730" y="276" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)" letter-spacing="1">REACTIVATION</text>
  <text x="730" y="290" font-family="monospace" font-size="8" fill="rgba(251,191,36,0.55)">Log in to restore</text>
  <text x="730" y="304" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)">as if nothing changed</text>
  <text x="934" y="290" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Not reversible</text>

  <line x1="730" y1="318" x2="1138" y2="318" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Row: emails -->
  <text x="730" y="334" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.28)" letter-spacing="1">EMAIL FROM SERVICE</text>
  <text x="730" y="348" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Usually stopped</text>
  <text x="934" y="348" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)">Stopped + unsubscribed</text>

  <!-- How to find deletion -->
  <line x1="730" y1="368" x2="1138" y2="368" stroke="rgba(59,130,246,0.1)" stroke-width="1"/>
  <text x="730" y="386" font-family="monospace" font-size="7.5" fill="rgba(59,130,246,0.55)" letter-spacing="1">HOW TO FIND THE DELETE OPTION</text>

  <text x="730" y="402" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.45)">Settings → Privacy or Security → "Close account" or "Delete account"</text>
  <text x="730" y="416" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.4)">Search "[service name] delete account" — usually a help page with link</text>
  <text x="730" y="430" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.35)">If buried: GDPR/CCPA give EU/California users right to request deletion</text>
  <text x="730" y="444" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.22)">Send formal deletion request to privacy contact email for older services</text>

  <!-- Footer -->
  <line x1="718" y1="460" x2="1150" y2="460" stroke="#1e3560" stroke-width="1"/>
  <text x="730" y="478" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.25)">Before deleting: export data if anything is worth keeping</text>
  <text x="730" y="494" font-family="monospace" font-size="7.5" fill="rgba(59,130,246,0.4)">Change password to something random before requesting deletion</text>
  <text x="730" y="510" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.18)">Dormant accounts can appear in breach notifications years later</text>
  <text x="730" y="526" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.15)">Old accounts often have stale recovery options — easier to take over</text>
  <text x="730" y="542" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.13)">5 minutes to close properly beats a breach notification 3 years from now</text>
</svg>
