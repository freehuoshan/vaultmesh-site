<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1005"/>
      <stop offset="100%" stop-color="#2d1a05"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#f59e0b"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="185" font-family="Georgia, serif" font-size="54" fill="white">Phishing by text:</text>
  <text x="76" y="251" font-family="Georgia, serif" font-size="54" fill="white">how SMS scams</text>
  <text x="76" y="317" font-family="Georgia, serif" font-size="54" fill="white">work and how</text>
  <text x="76" y="383" font-family="Georgia, serif" font-size="54" fill="white">to spot them</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-16  ·  phishing  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Phone + annotation callouts ── -->

  <!-- Phone outer frame -->
  <rect x="722" y="60" width="222" height="422" rx="22" fill="url(#phoneGrad)" stroke="rgba(245,158,11,0.22)" stroke-width="2"/>
  <!-- Camera notch -->
  <rect x="800" y="68" width="66" height="14" rx="7" fill="#0d0d0d"/>
  <!-- Home indicator -->
  <rect x="806" y="470" width="60" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Screen area -->
  <rect x="730" y="88" width="206" height="370" rx="4" fill="#121212"/>

  <!-- Status bar -->
  <text x="740" y="102" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.4)">9:41</text>
  <text x="928" y="102" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.35)" text-anchor="end">▪▪▪ ▪▪▪ ▪</text>

  <!-- Conversation header bar -->
  <rect x="730" y="106" width="206" height="30" fill="rgba(255,255,255,0.04)"/>
  <text x="833" y="126" font-family="monospace" font-size="8.5" fill="rgba(255,255,255,0.5)" text-anchor="middle">+1 (555) 847-2931</text>
  <line x1="730" y1="136" x2="936" y2="136" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Date label -->
  <text x="833" y="154" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.22)" text-anchor="middle">Today</text>

  <!-- Scam message bubble -->
  <rect x="738" y="162" width="182" height="108" rx="10" fill="rgba(245,158,11,0.07)" stroke="rgba(245,158,11,0.18)" stroke-width="1"/>
  <!-- Bubble tail (left) -->
  <polygon points="738,178 728,185 738,192" fill="rgba(245,158,11,0.07)"/>
  <text x="748" y="179" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.68)">USPS NOTICE: Your</text>
  <text x="748" y="193" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.68)">package could not be</text>
  <text x="748" y="207" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.68)">delivered. Confirm</text>
  <text x="748" y="221" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.68)">address to redeliver:</text>
  <!-- Shortened URL line (amber, underline-style) -->
  <text x="748" y="239" font-family="monospace" font-size="7.5" fill="rgba(245,158,11,0.8)">bit.ly/usps-redeliver-7k</text>
  <!-- Urgency line -->
  <text x="748" y="258" font-family="monospace" font-size="6.5" fill="rgba(239,68,68,0.55)">Action required within 24 hours</text>

  <!-- Timestamp -->
  <text x="833" y="282" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.2)" text-anchor="middle">2:14 PM</text>

  <!-- ── ANNOTATION CALLOUTS ── -->

  <!-- 1. NUMBER SPOOFABLE — points to header/sender -->
  <circle cx="936" cy="121" r="3" fill="rgba(239,68,68,0.5)"/>
  <line x1="939" y1="121" x2="970" y2="121" stroke="rgba(239,68,68,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="970" y="107" width="184" height="30" rx="4" fill="rgba(239,68,68,0.07)" stroke="rgba(239,68,68,0.28)" stroke-width="1"/>
  <text x="980" y="119" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.78)" letter-spacing="1">NUMBER SPOOFABLE</text>
  <text x="980" y="131" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.28)">can appear in real threads</text>

  <!-- 2. SHORTENED URL — points to bit.ly line -->
  <circle cx="936" cy="239" r="3" fill="rgba(239,68,68,0.5)"/>
  <line x1="939" y1="239" x2="970" y2="239" stroke="rgba(239,68,68,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="970" y="225" width="184" height="30" rx="4" fill="rgba(239,68,68,0.07)" stroke="rgba(239,68,68,0.28)" stroke-width="1"/>
  <text x="980" y="237" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.78)" letter-spacing="1">SHORTENED URL</text>
  <text x="980" y="249" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.28)">destination hidden before tap</text>

  <!-- 3. ARTIFICIAL URGENCY — points to "24 hours" line -->
  <circle cx="936" cy="258" r="3" fill="rgba(239,68,68,0.5)"/>
  <line x1="939" y1="258" x2="970" y2="290" stroke="rgba(239,68,68,0.4)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="970" y="276" width="184" height="30" rx="4" fill="rgba(239,68,68,0.07)" stroke="rgba(239,68,68,0.28)" stroke-width="1"/>
  <text x="980" y="288" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.78)" letter-spacing="1">ARTIFICIAL URGENCY</text>
  <text x="980" y="300" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.28)">"expires" bypasses careful thought</text>

  <!-- ── CORRECT RESPONSE PANEL ── -->
  <rect x="722" y="498" width="432" height="110" rx="10" fill="rgba(245,158,11,0.05)" stroke="rgba(245,158,11,0.28)" stroke-width="1.5"/>
  <rect x="722" y="498" width="432" height="34" rx="10" fill="rgba(245,158,11,0.14)"/>
  <rect x="722" y="518" width="432" height="14" fill="rgba(245,158,11,0.14)"/>
  <text x="938" y="520" font-family="monospace" font-size="9" fill="rgba(245,158,11,0.82)" text-anchor="middle" letter-spacing="2">CORRECT RESPONSE</text>
  <text x="736" y="551" font-family="monospace" font-size="8" fill="rgba(245,158,11,0.55)">→</text>
  <text x="750" y="551" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)">Do not tap the link</text>
  <text x="736" y="568" font-family="monospace" font-size="8" fill="rgba(245,158,11,0.55)">→</text>
  <text x="750" y="568" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)">Open your browser · go directly to usps.com</text>
  <text x="736" y="585" font-family="monospace" font-size="8" fill="rgba(245,158,11,0.55)">→</text>
  <text x="750" y="585" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.55)">Track using order email · not this text</text>
</svg>
