<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#0e1d3a"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111f40"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="56" y="56" width="4" height="518" fill="#3b82f6"/>

  <!-- PASSWORD SENSE label -->
  <text x="76" y="100" font-family="monospace" font-size="13" letter-spacing="4" fill="rgba(255,255,255,0.55)">PASSWORD SENSE</text>

  <!-- Post title -->
  <text x="76" y="188" font-family="Georgia, serif" font-size="54" fill="white">Staying logged</text>
  <text x="76" y="254" font-family="Georgia, serif" font-size="54" fill="white">in: when it's</text>
  <text x="76" y="320" font-family="Georgia, serif" font-size="54" fill="white">fine and when</text>
  <text x="76" y="386" font-family="Georgia, serif" font-size="54" fill="white">it isn't</text>

  <!-- Date + tags + wordmark -->
  <text x="76" y="580" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.28)" letter-spacing="1">2026-07-09  ·  accounts  ·  habits  ·  VAULTMESH</text>

  <!-- ── RIGHT SIDE: Session / Remember me illustration ── -->

  <!-- Browser window frame -->
  <rect x="715" y="72" width="435" height="265" rx="12" fill="url(#panelGrad)" stroke="#1e3560" stroke-width="1.5"/>
  <!-- Browser toolbar -->
  <rect x="715" y="72" width="435" height="36" rx="12" fill="#0e1d3a"/>
  <rect x="715" y="94" width="435" height="14" fill="#0e1d3a"/>
  <!-- Window dots -->
  <circle cx="737" cy="90" r="5" fill="rgba(255,255,255,0.12)"/>
  <circle cx="753" cy="90" r="5" fill="rgba(255,255,255,0.12)"/>
  <circle cx="769" cy="90" r="5" fill="rgba(255,255,255,0.12)"/>
  <!-- URL bar -->
  <rect x="784" y="79" width="304" height="20" rx="4" fill="#060f22" stroke="#1e3560" stroke-width="1"/>
  <text x="796" y="93" font-family="monospace" font-size="9" fill="rgba(59,130,246,0.55)">https://yourbank.com</text>

  <!-- Signed in indicator -->
  <text x="932" y="140" font-family="monospace" font-size="11" fill="rgba(34,197,94,0.65)" text-anchor="middle">Signed in as you@email.com</text>

  <!-- Remember me row -->
  <rect x="840" y="155" width="13" height="13" rx="2" fill="rgba(59,130,246,0.3)" stroke="#3b82f6" stroke-width="1.5"/>
  <polyline points="843,162 847,165 851,158" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="861" y="166" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.65)">Stay signed in for 30 days</text>

  <!-- Session cookie row -->
  <rect x="790" y="185" width="286" height="40" rx="5" fill="rgba(0,0,0,0.25)" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
  <text x="802" y="201" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.3)" letter-spacing="2">SESSION COOKIE</text>
  <text x="802" y="217" font-family="monospace" font-size="9" fill="rgba(59,130,246,0.5)">token=a3f9b… · 30 days · browser</text>

  <!-- Divider label -->
  <text x="932" y="252" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="2">SAME SESSION · TWO SCENARIOS</text>

  <!-- Connector lines down -->
  <line x1="932" y1="337" x2="932" y2="360" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="812" y1="360" x2="1122" y2="360" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="812" y1="360" x2="812" y2="378" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1122" y1="360" x2="1122" y2="378" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Left panel: YOUR DEVICE (safe) -->
  <rect x="718" y="378" width="198" height="185" rx="10" fill="rgba(34,197,94,0.05)" stroke="rgba(34,197,94,0.3)" stroke-width="1.5"/>
  <!-- Closed padlock -->
  <rect x="801" y="408" width="30" height="22" rx="3" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.5)" stroke-width="1.5"/>
  <path d="M806,408 L806,401 Q815,394 824,401 L824,408" fill="none" stroke="rgba(34,197,94,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="816" cy="418" r="3" fill="rgba(34,197,94,0.6)"/>
  <rect x="814" y="418" width="4" height="5" rx="1" fill="rgba(34,197,94,0.5)"/>
  <!-- Labels -->
  <text x="817" y="452" font-family="monospace" font-size="10" fill="rgba(34,197,94,0.7)" text-anchor="middle">YOUR DEVICE</text>
  <text x="817" y="468" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">screen locked</text>
  <text x="817" y="490" font-family="monospace" font-size="9" fill="rgba(34,197,94,0.55)" text-anchor="middle">session protected</text>
  <text x="817" y="508" font-family="monospace" font-size="8" fill="rgba(34,197,94,0.6)" text-anchor="middle">— fine</text>
  <!-- Green glow -->
  <rect x="718" y="378" width="198" height="185" rx="10" fill="none" stroke="rgba(34,197,94,0.15)" stroke-width="6"/>

  <!-- Right panel: SHARED DEVICE (risky) -->
  <rect x="930" y="378" width="210" height="185" rx="10" fill="rgba(239,68,68,0.05)" stroke="rgba(239,68,68,0.3)" stroke-width="1.5"/>
  <!-- Open padlock -->
  <rect x="1021" y="408" width="30" height="22" rx="3" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.5)" stroke-width="1.5"/>
  <!-- right leg still in body, left leg raised off to the side -->
  <line x1="1050" y1="408" x2="1050" y2="401" stroke="rgba(239,68,68,0.6)" stroke-width="2" stroke-linecap="round"/>
  <path d="M1050,401 Q1041,394 1032,401" fill="none" stroke="rgba(239,68,68,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1032" y1="401" x2="1032" y2="395" stroke="rgba(239,68,68,0.6)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="1036" cy="418" r="3" fill="rgba(239,68,68,0.6)"/>
  <rect x="1034" y="418" width="4" height="5" rx="1" fill="rgba(239,68,68,0.5)"/>
  <!-- Labels -->
  <text x="1035" y="452" font-family="monospace" font-size="10" fill="rgba(239,68,68,0.7)" text-anchor="middle">SHARED DEVICE</text>
  <text x="1035" y="468" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle">no lock screen</text>
  <text x="1035" y="490" font-family="monospace" font-size="9" fill="rgba(239,68,68,0.55)" text-anchor="middle">next user sees session</text>
  <text x="1035" y="508" font-family="monospace" font-size="8" fill="rgba(239,68,68,0.7)" text-anchor="middle">— exposed</text>
  <!-- Red glow -->
  <rect x="930" y="378" width="210" height="185" rx="10" fill="none" stroke="rgba(239,68,68,0.12)" stroke-width="6"/>

  <!-- Fix hint -->
  <text x="932" y="582" font-family="monospace" font-size="10" fill="rgba(59,130,246,0.45)" text-anchor="middle" letter-spacing="1">FIX: lock your screen · log out on shared machines</text>
</svg>
